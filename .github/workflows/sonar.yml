name: SonarCloud
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  sonar:
    name: Tests y análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Proyecto/requirements.txt

      - name: Instalar dependencias y ejecutar tests con cobertura
        working-directory: Proyecto
        run: |
          pip install -r requirements.txt pytest-cov
          pytest --cov=app --cov-report=xml

      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}