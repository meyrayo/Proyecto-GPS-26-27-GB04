{# US-16: botón «Añadir a la cesta» de cada producto del catálogo. Solo en los disponibles. #}
{% if p.disponible %}
  <form class="form-anadir-cesta" method="post" action="{{ url_for('cesta.anadir', id_producto=p.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="cantidad" value="1">
    <input type="hidden" name="volver" value="{{ request.full_path }}">
    <button type="submit" class="boton-cesta" aria-label="Añadir {{ p.nombre }} a la cesta">Añadir a la cesta</button>
  </form>
{% endif %}
